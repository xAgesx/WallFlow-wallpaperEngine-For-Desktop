<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="300" rx="12" fill="#0d111a"/>
  <text x="24" y="34" fill="#e6e9f2" font-size="17" font-weight="600">Frame rate vs a 120 Hz display</text>
  <text x="24" y="56" fill="#8b93a7" font-size="12.5">requestAnimationFrame sampling: average over the run, and the worst full 1-second window</text>

  <g stroke="#1c2230" stroke-width="1">
    <line x1="160" y1="74" x2="160" y2="258"/>
    <line x1="285" y1="74" x2="285" y2="258"/>
    <line x1="410" y1="74" x2="410" y2="258"/>
    <line x1="535" y1="74" x2="535" y2="258"/>
    <line x1="660" y1="74" x2="660" y2="258"/>
  </g>

  <text x="150" y="101" fill="#aab3c5" font-size="13" text-anchor="end">Wallpaper avg</text>
  <rect x="160" y="82" width="495.4" height="26" rx="4" fill="#8b9cff"/>
  <text x="646" y="100" fill="#0a0d13" font-size="13" font-weight="600" text-anchor="end">118.9</text>

  <text x="150" y="149" fill="#aab3c5" font-size="13" text-anchor="end">Wallpaper worst 1 s</text>
  <rect x="160" y="130" width="475" height="26" rx="4" fill="#a78bfa"/>
  <text x="626" y="148" fill="#0a0d13" font-size="13" font-weight="600" text-anchor="end">114.0</text>

  <text x="150" y="197" fill="#aab3c5" font-size="13" text-anchor="end">Library avg</text>
  <rect x="160" y="178" width="499.2" height="26" rx="4" fill="#8b9cff"/>
  <text x="650" y="196" fill="#0a0d13" font-size="13" font-weight="600" text-anchor="end">119.8</text>

  <text x="150" y="245" fill="#aab3c5" font-size="13" text-anchor="end">Library worst 1 s</text>
  <rect x="160" y="226" width="495.8" height="26" rx="4" fill="#a78bfa"/>
  <text x="647" y="244" fill="#0a0d13" font-size="13" font-weight="600" text-anchor="end">119.0</text>

  <g fill="#6d7588" font-size="11.5" text-anchor="middle">
    <text x="160" y="276">0</text>
    <text x="285" y="276">30</text>
    <text x="410" y="276">60</text>
    <text x="535" y="276">90</text>
    <text x="660" y="276">120 fps</text>
  </g>
</svg>
