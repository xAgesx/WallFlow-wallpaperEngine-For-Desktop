<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="300" rx="12" fill="#0d111a"/>
  <text x="24" y="34" fill="#e6e9f2" font-size="17" font-weight="600">CPU over a 30 s steady-state window</text>
  <text x="24" y="56" fill="#8b93a7" font-size="12.5">Percent of one core, per process. Total: 112.6% of one core = 14.1% of the 8-thread CPU</text>

  <g stroke="#1c2230" stroke-width="1">
    <line x1="160" y1="74" x2="160" y2="258"/>
    <line x1="285" y1="74" x2="285" y2="258"/>
    <line x1="410" y1="74" x2="410" y2="258"/>
    <line x1="535" y1="74" x2="535" y2="258"/>
    <line x1="660" y1="74" x2="660" y2="258"/>
  </g>

  <text x="150" y="101" fill="#aab3c5" font-size="13" text-anchor="end">GPU process</text>
  <rect x="160" y="82" width="442.5" height="26" rx="4" fill="#8b9cff"/>
  <text x="612" y="100" fill="#e6e9f2" font-size="13">70.8%</text>

  <text x="150" y="149" fill="#aab3c5" font-size="13" text-anchor="end">Renderer (active)</text>
  <rect x="160" y="130" width="252.5" height="26" rx="4" fill="#a78bfa"/>
  <text x="422" y="148" fill="#e6e9f2" font-size="13">40.4%</text>

  <text x="150" y="197" fill="#aab3c5" font-size="13" text-anchor="end">Main</text>
  <rect x="160" y="178" width="8.1" height="26" rx="4" fill="#6b7ad6"/>
  <text x="178" y="196" fill="#e6e9f2" font-size="13">1.3%</text>

  <text x="150" y="245" fill="#aab3c5" font-size="13" text-anchor="end">Idle renderer + utility</text>
  <rect x="160" y="226" width="2" height="26" fill="#4a5580"/>
  <text x="172" y="244" fill="#e6e9f2" font-size="13">0%</text>

  <g fill="#6d7588" font-size="11.5" text-anchor="middle">
    <text x="160" y="276">0</text>
    <text x="285" y="276">20</text>
    <text x="410" y="276">40</text>
    <text x="535" y="276">60</text>
    <text x="660" y="276">80% of one core</text>
  </g>
</svg>
